# ============================================================
#  En-têtes de sécurité du site vitrine
#
#  À déposer sur le serveur dans :
#      /etc/nginx/snippets/yobante-security-headers.conf
#  puis `nginx -t && systemctl reload nginx`.
#
#  Inclus par deploy/nginx.conf dans le bloc server ET dans chaque location
#  qui définit déjà un add_header (nginx n'hérite PAS des add_header du
#  parent dès qu'une location en déclare un : sans cet include répété, ces
#  réponses perdraient leurs en-têtes de sécurité).
# ============================================================

# Politique de contenu : tout vient du site lui-même (scripts, polices, images).
#  - style-src 'unsafe-inline' : les composants embarquent leurs styles dans des
#    balises <style> ; à retirer le jour où les styles passent en fichiers CSS.
#  - img-src data: : Vite inline les très petites images.
#  - connect-src : le formulaire de contact appelle l'API (https://api.yobanterek.com).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.yobanterek.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Anti-clickjacking pour les anciens navigateurs (frame-ancestors couvre les autres).
add_header X-Frame-Options "DENY" always;

# HTTPS imposé pendant 1 an. À activer SEULEMENT quand le certificat est en place
# et que yobante-boutique.com répond bien en HTTPS (un navigateur
# mémorise cette règle).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
