# ============================================================
#  Yobante Boutique — fichiers statiques déposés par le CI
#  Le CI (.github/workflows/deploy.yml) copie dist/ dans /var/www/yobante-boutique.
#
#  Déposer dans : /etc/nginx/sites-available/yobante-boutique
#  Activer via  : ln -sf /etc/nginx/sites-available/yobante-boutique /etc/nginx/sites-enabled/yobante-boutique
#  HTTPS        : certbot --nginx -d yobante-boutique.com -d www.yobante-boutique.com
#                 (Certbot ajoute lui-même les blocs 443 et la redirection)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name yobante-boutique.com www.yobante-boutique.com;

    # En-têtes de sécurité (CSP, HSTS…) : voir deploy/security-headers.conf.
    include snippets/yobante-security-headers.conf;

    root /var/www/yobante-boutique;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # Repli SPA sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets changent de nom à chaque build (hash Vite) : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/yobante-security-headers.conf;
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache, sinon les visiteurs
    # gardent l'ancienne version après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/yobante-security-headers.conf;
    }

    # Polices et images servies depuis public/ : noms stables (pas de hash), cache de 30 jours.
    location ~* ^/(fonts|images)/ {
        add_header Cache-Control "public, max-age=2592000";
        include snippets/yobante-security-headers.conf;
        try_files $uri =404;
    }

    access_log /var/log/nginx/yobante-boutique-access.log combined;
    error_log  /var/log/nginx/yobante-boutique-error.log warn;
}
