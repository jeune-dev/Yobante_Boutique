name: E2E (Playwright)

# Workflow séparé du déploiement : il vérifie les pull requests et peut être lancé à la
# main, sans jamais bloquer ni retarder une mise en production sur `main`.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-yobante-boutique-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Le build et le serveur de prévisualisation sont lancés par playwright.config.js
      # (les variables VITE_* de test y sont définies : l'API est simulée par les tests).
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
