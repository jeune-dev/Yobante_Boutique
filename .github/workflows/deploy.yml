name: Deploy Yobante Boutique to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Un seul déploiement à la fois : un push arrivé pendant un déploiement
# attend la fin du précédent.
concurrency:
  group: deploy-yobante-boutique-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Variables VITE_* : figées dans le bundle au build.
      - name: Write .env
        run: |
          {
            echo "VITE_CONTACT_PHONE=${{ secrets.VITE_CONTACT_PHONE }}"
            echo "VITE_WHATSAPP_NUMBER=${{ secrets.VITE_WHATSAPP_NUMBER }}"
          } > .env

      - name: Build
        run: npm run build

      # dist/ est servi à la racine du domaine par Nginx (voir deploy/nginx.conf).
      - name: Deploy dist/ to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/yobante-boutique"
          strip_components: 1
          overwrite: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            curl -f -I "${{ secrets.SITE_URL }}/" || exit 1
